[workspace]
resolver = "3"
members = ["crates/etng-core", "crates/etng-cli", "crates/etng-tags", "xtask"]

[workspace.package]
version = "0.28.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/AndrewBiz/etng"

[workspace.dependencies]
etng-core = { path = "crates/etng-core" }
etng-tags = { path = "crates/etng-tags" }
kamadak-exif = "0.6.2"
quick-xml = "0.38"
rayon = "1.11"
serde_json = "1.0"
memmap2 = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
glob = "0.3"
md-5 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
