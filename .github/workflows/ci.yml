name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TZ: Europe/Moscow

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: exiftool shim tests
        run: python3 tools/exiftool-shim/test_shim.py

  compare:
    name: exiftool parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: Install exiftool 13.55
        run: |
          curl -fsSL https://github.com/exiftool/exiftool/archive/refs/tags/13.55.tar.gz \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/exiftool-13.55" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/exiftool-13.55/exiftool" -ver
      - run: cargo build --workspace
      - run: cargo run -q -p xtask -- compare

  phtools:
    name: phtools integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Checkout phtools
        uses: actions/checkout@v5
        with:
          repository: AndrewBiz/phtools
          ref: 8e3f18c75e08b5b9e93afa0dfc4a58a95ff9b27c
          path: phtools
      - name: Install phtools dependencies
        run: |
          cd phtools
          printf "\ngem 'erb'\ngem 'mutex_m'\n" >> Gemfile
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3
      - name: Run phtools through etng shim
        env:
          PHTOOLS_DIR: ${{ github.workspace }}/phtools
          ETNG_SHIM_KEEP: "1"
        run: |
          cargo build -q -p etng-cli
          target/debug/etng -ver
          target/debug/etng -j phtools/features/media/sony_jpg/DSC03403.JPG | wc -c
          mkdir -p .ci-shim
          cp tools/exiftool-shim/exiftool .ci-shim/exiftool
          chmod +x .ci-shim/exiftool
          cd phtools
          PATH="$PWD/../.ci-shim:$PATH" ETNG_BIN="$PWD/../target/debug/etng" \
            bundle exec ruby -Ilib -e 'require "mini_exiftool"; t=MiniExiftool.new(ARGV[0], numerical: false, coord_format: "%d %d %.4f", replace_invalid_chars: true, composite: true, timestamps: DateTime); h=t.to_hash; puts "keys=#{h.size}"; puts h.keys.first(5).inspect; puts h.keys.last(5).inspect; puts "bytes=#{t.instance_variable_get(:@output).bytesize}"' features/media/sony_jpg/DSC03403.JPG
          cd ..
          ./tools/phtools-integration.sh
